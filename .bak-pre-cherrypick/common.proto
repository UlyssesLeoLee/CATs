syntax = "proto3";

package cats.v1;

option go_package = "github.com/cats/proto/v1;catsv1";
option java_multiple_files = true;
option java_package = "com.cats.proto.v1";

// =========================================================
// v1.0.1 新增 (per 接口设计书 v2.0+2 §3.5 + 决议 10 错误码引用闭环前置同步)
// commit baseline: 错误码表 v1.0 (commit 2146f53) §3 28 条 + Rust impl
//                   crates/auth-service/src/models.rs:42
// 引用: doc/05-其他/管理/CATs_错误码表_v1.0.md §2.1 + §3
//       api/openapi/cats-openapi-v1.0.1.yaml
//       doc/03-详细设计/接口设计/CATs_接口设计书_v2.0.md §3.5.1 (v2.0+2)
// =========================================================

// 统一错误响应 (per 错误码表 §2.1 + Rust impl, 3 字段)
// 跟 §1.3 高层嵌套信封 (4 字段) 不同, 真实落地以本 message 为准
message ErrorBody {
  // 业务错误码枚举 (per 错误码表 §3, 28 条 snake_case, machine-readable)
  ErrorCode error = 1;
  // 人类可读错误描述 (i18n 前缀, 默认 en-US, per 错误码表 §2.1)
  string message = 2;
  // 可选上下文 (不暴露 secret / PII, 内部 detail 走 detail 不走 message)
  optional string detail = 3;
}

// 业务错误码枚举 (per 错误码表 v1.0 §3, 28 条 snake_case)
// 0 留作 UNSPECIFIED (proto3 默认), 1-28 对应错误码表 §3.2-§3.7
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  // 客户端请求错误 (§3.2, 5 条)
  INVALID_REQUEST = 1;
  INVALID_PAYLOAD = 2;
  INVALID_HEADER = 3;
  INVALID_QUERY = 4;
  UNSUPPORTED_VERSION = 5;

  // 鉴权错误 (§3.3, 8 条)
  INVALID_CREDENTIALS = 10;
  INVALID_TOKEN = 11;
  TOKEN_EXPIRED = 12;
  TOKEN_REVOKED = 13;
  INVALID_TOKEN_TYPE = 14;
  MISSING_AUTHORIZATION = 15;
  INVALID_AUTHORIZATION_SCHEME = 16;
  USER_INACTIVE = 17;

  // 资源错误 (§3.4, 6 条)
  USER_NOT_FOUND = 20;
  TOKEN_NOT_FOUND = 21;
  RESOURCE_NOT_FOUND = 22;
  USERNAME_CONFLICT = 23;
  EMAIL_CONFLICT = 24;
  TOKEN_ALREADY_REVOKED = 25;

  // 限流 / 配额 (§3.5, 2 条)
  RATE_LIMITED = 30;
  QUOTA_EXCEEDED = 31;

  // 服务端错误 (§3.6, 4 条)
  SERVER_ERROR = 40;
  SERVER_MISCONFIGURED = 41;
  DEPENDENCY_UNAVAILABLE = 42;
  DEPENDENCY_TIMEOUT = 43;

  // 业务规则 (§3.7, 2 条有效, user_inactive 已在 §3.3)
  PASSWORD_MISMATCH = 50;
  OPERATION_NOT_PERMITTED = 51;
}

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
}

message PageMeta {
  int32 page = 1;
  int32 page_size = 2;
  int64 total_count = 3;
  int32 total_pages = 4;
}

enum LanguageCode {
  LANG_UNSPECIFIED = 0;
  LANG_ZH_CN = 1;
  LANG_ZH_TW = 2;
  LANG_EN_US = 3;
  LANG_JA_JP = 4;
  LANG_KO_KR = 5;
  LANG_DE_DE = 6;
  LANG_FR_FR = 7;
  LANG_ES_ES = 8;
  LANG_RU_RU = 9;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_PARSING = 2;
  TASK_STATUS_TRANSLATING = 3;
  TASK_STATUS_QA_REVIEWING = 4;
  TASK_STATUS_RENDERING = 5;
  TASK_STATUS_COMPLETED = 6;
  TASK_STATUS_FAILED = 7;
}