# CATs M0 Rust Build CI
# 引用: doc/02-基础设计/技术选型/CATs_技术基线_v1.0.md §1（rust:1.98.0-slim-bookworm 镜像）
# 引用: ci/scripts/proto-gen.ps1（编译 proto）
#
# Matrix: 3 OS × 多 target，覆盖 Linux（K3s 实际部署目标）+ macOS / Windows（开发者本地）
# M0 阶段仅 Linux 是 release target，mac/win 走 cache + 编译验证（不全 link）

name: ci-rust-build

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 取消同一 ref 上正在跑的旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # M0 release 目标：仅 Linux GNU
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cats-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: cats-linux-arm64
          # 开发者本地目标：编译验证（不全 link 发布）
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: cats-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cats-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lld (Linux, per .cargo/config.toml -fuse-ld=lld)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld

      - name: Install Rust toolchain 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-cache
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Install Linux cross-compile deps
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build workspace
        run: cargo build --workspace --all-targets --target ${{ matrix.target }} --locked

      # Release profile is the only one the deployed images are built from, and
      # it differs from the dev profile in ways that change whether code exists.
      # `AppState::new_with_buffer` was marked #[cfg(any(test, debug_assertions))]
      # while main.rs called it on the production path, so every dev-profile job
      # above was green while `cargo build --release` failed with E0599 and 9 of
      # 18 service images could not be built.
      #
      # Previously this job never passed --release, yet the artifact upload below
      # pointed at target/<target>/release/cats-* — a directory that step never
      # produced, so the upload silently shipped nothing while the job reported
      # success. Restricted to Linux x86_64 to keep CI cost bounded; that is the
      # actual deploy target per the header comment.
      - name: Build release binaries (deploy profile)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --workspace --release --target ${{ matrix.target }} --locked

      - name: Stage release binaries
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release"
          mkdir -p dist
          # 只取可执行文件：release/ 根目录下的 .d 文件以及
          # deps/ build/ incremental/ 子目录自然被排除（-type f + -perm -u+x）。
          #
          # 2026-10-05 修正。原来是 `path: target/.../release/cats-*`，而
          # 17 个 service 里**只有 cats-bff 一个**叫 cats-*。其余 16 个
          # （auth-service / user-service / project-service / task-service / file-service /
          #   notification-service / report-service / audit-service / worker-service /
          #   translation-core / ingestion-service / asr-service / ocr-service /
          #   subtitle-service / office-converter-service / render-writer-service）
          # 一个都不匹配。
          # `if-no-files-found: error` 因为那 1 个确实存在而**没有触发**——
          # 绿灯、无错误、artifact 里却只有 1 个二进制。
          # 全仓库没有 `download-artifact`，所以这个缺陷一直没被发现。
          find "$src" -maxdepth 1 -type f -perm -u+x -exec cp {} dist/ \;
          n=$(find dist -maxdepth 1 -type f | wc -l)
          echo "staged $n binaries:"
          ls -1 dist
          if [ "$n" -lt 5 ]; then
            echo "::error::release binaries look wrong: got $n, expected the whole workspace's service set"
            exit 1
          fi

      - name: Upload binaries
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist
          retention-days: 7
          if-no-files-found: error
