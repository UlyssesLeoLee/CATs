# CATs M0 Docker Build CI
# 引用: deploy/docker/Dockerfile.rust
# 引用: 完成判据（distroless/cc-debian12 基础镜像）
#
# Matrix: 17 service + 1 bff = 18 个独立构建 target
# 推送目标: harbor.cats.internal/cats/<service>:<tag>

name: ci-docker-build

on:
  push:
    branches: [main, dev, 'feature/**', 'feat/**']
    tags: ['v*']
    # 2026-10-05: 加 feat/**、去掉 pull_request 的 base 过滤 —— 否则本分支
    # 两头都不匹配，push 不触发任何检查。起因见 BACKEND_STATUS_v0.4 §4.1b。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: harbor.cats.internal
  IMAGE_PREFIX: cats
  # 2026-10-07 新增。Harbor 凭据**当前并不存在**（`GET /actions/secrets`
  # 返回 total_count=0），而下面 Login 步骤在 push 事件时会去登 Harbor，
  # 于是每个 push 的 docker build 都在 setup 阶段 17 秒内失败：
  #     ##[error]Username and password required
  # 它只因"每次 push 都会取消上一次 push 的 docker build"而一直没被发现 ——
  # 被取消的作业不产生失败记录，红的都是取消前抢到 runner 的那批。
  #
  # 修法：把"要不要发布"的条件从"事件类型"改成"事件类型 **且** 凭据存在"。
  # 凭据一旦配好，push 事件会自动恢复登录并推送，行为不变；
  # 在此之前 push 事件只构建不推送 —— CI 该验证的是"镜像能不能构建出来"，
  # 发布到 registry 是另一件事，不该让它把整条流水线永久拉红。
  #
  # 关键点：**`secrets` 上下文在 step 级 `if` 里不可用**，只能借 `env` 中转。
  #（GitHub 文档：`secrets` 可用于 `with` / `env` / `jobs.*.steps.*`，但 `if`
  #  可用的上下文里没有 `secrets`。）
  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

jobs:
  build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            crate: auth-service
            port: 8081
          - service: user-service
            crate: user-service
            port: 8082
          - service: project-service
            crate: project-service
            port: 8083
          - service: task-service
            crate: task-service
            port: 8084
          - service: file-service
            crate: file-service
            port: 8085
          - service: notification-service
            crate: notification-service
            port: 8086
          - service: report-service
            crate: report-service
            port: 8087
          - service: audit-service
            crate: audit-service
            port: 8088
          - service: worker-service
            crate: worker-service
            port: 8089
          - service: translation-core
            crate: translation-core
            port: 8090
          - service: ingestion-service
            crate: ingestion-service
            port: 8091
          - service: asr-service
            crate: asr-service
            port: 8092
          - service: ocr-service
            crate: ocr-service
            port: 8093
          - service: subtitle-service
            crate: subtitle-service
            port: 8094
          - service: office-converter-service
            crate: office-converter-service
            port: 8095
          - service: render-writer-service
            crate: render-writer-service
            port: 8096
          - service: cats-bff
            crate: cats-bff
            port: 8097
          # 2026-10-05 补入。cats-ai-gateway 一直有 src/main.rs（产出二进制），
          # docker-compose-mvp.yml 里也声明了跑 /usr/local/bin/cats-ai-gateway 的
          # `ai-gateway` service，但本地 compose 走的是 Dockerfile.runtime 产出的
          # 单一 `cats-runtime:latest`（含全部二进制），**掩盖了缺镜像这件事**。
          # CI 出的是 per-service 镜像推 Harbor，缺它 = 部署侧拿不到这个镜像。
          - service: cats-ai-gateway
            crate: cats-ai-gateway
            port: 8090
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        # 非 PR 事件、且凭据确实存在时才登录。
        # 少了 `&& env.HARBOR_USERNAME != ''` 这一段，push 事件会拿着空凭据去登录
        # 并以 `Username and password required` 失败 —— 那不是构建问题，
        # 但会让每个 push 的这条 workflow 恒红。
        if: github.event_name != 'pull_request' && env.HARBOR_USERNAME != '' && env.HARBOR_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=0.1.0,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.rust
          # 与 Login 步骤同一套条件：**要么登录并推送，要么只构建**。
          # 两边条件必须一致 —— 只改一边会出现"推送了但没登录"或反之。
          push: ${{ github.event_name != 'pull_request' && env.HARBOR_USERNAME != '' && env.HARBOR_PASSWORD != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CRATE_NAME=${{ matrix.crate }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
