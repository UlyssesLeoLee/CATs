# CATs M0 Rust Clippy CI
# 引用: 完成判据 3（RUSTFLAGS='-D warnings' cargo clippy --workspace --all-features --all-targets）
# 引用: doc/02-基础设计/技术选型/CATs_Rust技术选型书_v1.0.md §3.3（静态分析）

name: ci-rust-clippy

on:
  push:
    branches: [main, dev, 'feature/**', 'feat/**']
    # 2026-10-05: 加 feat/**、去掉 pull_request 的 base 过滤 —— 否则本分支
    # 两头都不匹配，push 不触发任何检查。起因见 BACKEND_STATUS_v0.4 §4.1b。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lld (Linux, per .cargo/config.toml -fuse-ld=lld)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld

      - name: Install Rust toolchain 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-cache
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      # -D warnings：任何 warning 视为错误（per 完成判据 3）
      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
