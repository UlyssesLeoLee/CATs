# CATs M0 Helm Lint CI
# 引用: deploy/helm/* 18 chart
# 引用: 完成判据 5（helm chart 骨架不需要 helm 验证，只需 YAML 语法 OK）
# 注: M0 阶段不强制安装 helm；M1 阶段启用完整 helm lint + kubeconform

name: ci-helm-lint

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-syntax:
    name: YAML syntax (all charts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # M0 阶段：仅做 YAML 语法 sanity check（不需要 helm）
      - name: Install yq
        run: sudo snap install yq || sudo apt-get install -y yq

      - name: Verify all YAML parses
        run: |
          set -e
          for f in $(find deploy/helm -name "*.yaml" -o -name "*.yml"); do
            echo "Checking: $f"
            yq eval 'true' "$f" > /dev/null || (echo "FAIL: $f" && exit 1)
          done
          echo "All $(find deploy/helm -name "*.yaml" -o -name "*.yml" | wc -l) YAML files parse OK"

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Build dependencies
        run: |
          for chart in deploy/helm/cats-*; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "=== $chart ==="
              helm dependency build "$chart" || true
            fi
          done

      - name: Lint all charts
        run: |
          for chart in deploy/helm/cats-*; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "=== Lint $chart ==="
              helm lint "$chart" || exit 1
            fi
          done
