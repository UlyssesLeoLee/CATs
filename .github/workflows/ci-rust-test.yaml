# CATs M0 Rust Test CI
# 引用: 完成判据 4（cargo test --workspace --all-features）
# 引用: doc/02-基础设计/技术选型/CATs_Rust技术选型书_v1.0.md §3.4（测试工具）

name: ci-rust-test

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  # llvm-cov 默认输出格式
  LLVM_PROFILE_FILE: "target/coverage/%p-%m.profraw"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install Rust toolchain 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-cache
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace --all-features --locked -- --nocapture

      # 引用: doc/02-基础设计/测试/CATs_测试Mock项目设计书_v1.0.md §5.3
      # 2026-09-01 改造: 16 service smoke boilerplate 替换为 cats_mock::smoke::name_matches_crate!
      # 故 smoke.rs 行数从 ~16 → 7, 真实业务测试占比上升, 覆盖率门槛从 M0 的无门槛 → 40% 强制
      - name: cats-mock self-test (proves macro works for 16 services)
        run: cargo test -p cats-mock --locked -- --nocapture

      - name: Coverage gate (Linux, fail-under 40%)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-llvm-cov --quiet || true
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
          cargo llvm-cov --workspace --all-features --fail-under-lines 40
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
