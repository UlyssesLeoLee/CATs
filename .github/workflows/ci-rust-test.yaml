# CATs M0 Rust Test CI
# 引用: 完成判据 4（cargo test --workspace --all-features）
# 引用: doc/02-基础设计/技术选型/CATs_Rust技术选型书_v1.0.md §3.4（测试工具）

name: ci-rust-test

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always
  # llvm-cov 默认输出格式
  LLVM_PROFILE_FILE: "target/coverage/%p-%m.profraw"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
      # llvm-cov 默认输出格式
      LLVM_PROFILE_FILE: "target/coverage/%p-%m.profraw"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 注: 本 job 不建库也不灌 migration——DB-backed e2e 全部在下面的 `e2e`
      # job 里跑。此处曾留过一个 "Create e2e databases and apply migrations"
      # 步骤，但它所在 job 没有任何 Postgres service，psql 直接
      # "Connection refused"（run 37112321110 ubuntu 失败实证），属于死代码。

      - name: Install lld (Linux, per .cargo/config.toml -fuse-ld=lld)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld

      - name: Install Rust toolchain 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      # compose / envoy / 源码接线的静态不变量。2026-10-04 修的 12 处缺陷里有
      # 好几处读代码看不出来（ai-gateway 没写 command 会继承镜像 CMD 跑成 cats-bff；
      # envoy filter 缺 typed_config 启动即崩），手修完没有闸门会再退化。
      # 这个检查不需要构建镜像也不需要起容器，几秒就能跑完。
      #
      # 它不是橡皮章，每条规则都做过双向验证：
      #   规则 1-5  对修复前的 compose 报 15 项违规，修复后 0 项
      #   规则 6    对修复前的 compose 报 7 项（全是源码从不读取的 env 变量），
      #             修复后 0 项。这条抓出了 translation-core 监听 8090 而全链路
      #             指着 50051 的 P0
      #   规则 7    塞一个没被 mod 声明的 .rs 即 FAIL。这条抓出 12 个 crate 共
      #             5731 行从未编译的代码（已列入基线，新增即 FAIL）
      - name: Lint docker-compose + envoy invariants
        if: matrix.os == 'ubuntu-latest'
        run: python deploy/scripts/lint-compose.py

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-cache
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace --all-features --locked -- --nocapture

      # 引用: doc/02-基础设计/测试/CATs_测试Mock项目设计书_v1.0.md §5.3
      # 2026-09-01 改造: 16 service smoke boilerplate 替换为 cats_mock::smoke::name_matches_crate!
      # 故 smoke.rs 行数从 ~16 → 7, 真实业务测试占比上升, 覆盖率门槛从 M0 的无门槛 → 40% 强制
      - name: cats-mock self-test (proves macro works for 16 services)
        run: cargo test -p cats-mock --locked -- --nocapture

      - name: Coverage gate (Linux, fail-under 40%)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-llvm-cov --quiet || true
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
          cargo llvm-cov --workspace --all-features --fail-under-lines 40
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        # continue-on-error: 上传是**上报**，不是门禁 —— 真正的门禁是上面那个
        # `--fail-under-lines 40`，它在上传之前就已经给出结论了。
        #
        # 真实事故（run 37278878858，2026-10-05）: 本步骤因 codecov.io 的
        # TLS 握手失败而红:
        #   Error: write EPROTO ...: ssl/tls alert handshake failure
        # 同一个 job 里 `Run tests` 与 `Coverage gate` 都通过了，
        # macOS / Windows / e2e 三个 job 也全绿 —— 整条流水线只因为
        # 「把报告传到第三方」而变红。
        #
        # 注意 `fail_ci_if_error: false` 挡不住这个: 那是 codecov 解析/上传
        # 失败时的开关，而 TLS 握手失败是 action 内部的 JS 硬错误，
        # 绕过了该开关。必须用 `continue-on-error`。
        continue-on-error: true
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # 45 个 DB-backed e2e 此前全部标 #[ignore = "e2e-needs-real-pg"]，从未在任何
  # CI 执行过。它们靠 #[ignore] + Once 惰性初始化双重掩盖：Once 让首次失败把
  # 状态毒化，把"缺数据库"这个真实原因变成"测试失败"。
  #
  # 为什么是独立 job 而不是 test job 的一个步骤：
  # 1. services.<id> 下不允许 if:——GitHub 解析器在该行报 "Unexpected value
  #    'if'" 并拒绝启动任何 job（只显示 "This run likely failed because of a
  #    workflow file issue"，没有任何 job 记录）。
  # 2. 而不加 if: 也不行——service 容器只在 Linux runner 上可用，macOS 报
  #    "docker: command not found"，Windows 报 "Container operations are only
  #    supported on Linux runners"。
  # 所以只能整体挪到 runs-on: ubuntu-latest 的独立 job。
  e2e:
    name: e2e (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # 必须是 pgvector 镜像而非官方 postgres:18——project-service 的
        # 20260919_0001_init.sql 执行 `CREATE EXTENSION IF NOT EXISTS vector`
        # （per 技术选型 ADR-30 + 技术基线 v1.0 §1），官方镜像没有 pgvector，
        # 会以 "extension \"vector\" is not available" 失败
        # （run 37112321110 e2e 失败实证）。本机 e2e 用的也是 pg18 变体。
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
      # 测试用固定值，非真实凭据
      JWT_SECRET: ci-e2e-only-not-a-real-secret
      TEST_PASSWORD: ci-e2e-only-9f3a2b
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lld (per .cargo/config.toml -fuse-ld=lld)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld

      - name: Install Rust toolchain 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      # 建库 + 应用 migrations。
      #
      # 复用 deploy/scripts/init-databases.sh —— 与 docker compose 的
      # db-init service 跑的是**同一份脚本**。这不只是去重：
      #
      # 本 PR 之前，CI 只对 5 个有 e2e 的 service 应用 migration
      # （auth/user/project/file/notification）。audit-service 与
      # task-service 不在任何 e2e 清单里，于是它们的 migration 从未被
      # 任何自动化验证过。实际跑起来才发现 audit-service 的 migration
      # 在空库上直接失败（分区表主键/唯一约束必须含分区键），
      # 45 个 e2e + 487 个单元测试全都没发现——因为它一个 DB 测试都没有。
      #
      # 改成调用脚本后，任何 service 的 migration 只要在空库上跑不通，
      # 无论它有没有 e2e，CI 都会红。
      - name: Create databases and apply migrations (all services)
        run: |
          set -euo pipefail
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres \
            bash deploy/scripts/init-databases.sh

      # 串行执行：这些测试共用固定表名（users_credential / files / projects /
      # notifications），并发会互相污染对方的种子数据。
      - name: Run DB-backed e2e
        run: |
          set -euo pipefail
          run_suite() {
            local pkg="$1" db="$2" target="${3:-}"
            local url="postgres://postgres:postgres@127.0.0.1:5432/${db}"
            if [ -n "$target" ]; then
              echo "=== ${pkg} --test ${target} -> ${db} ==="
              DATABASE_URL="$url" cargo test -p "$pkg" --test "$target" \
                --all-features --locked -- --ignored --test-threads=1 --nocapture
            else
              echo "=== ${pkg} (all targets) -> ${db} ==="
              DATABASE_URL="$url" cargo test -p "$pkg" --all-features --locked \
                -- --ignored --test-threads=1 --nocapture
            fi
          }
          run_suite auth-service         auth_db         e2e_auth
          run_suite auth-service         auth_db         e2e_t01
          run_suite user-service         user_db         e2e_t02
          run_suite project-service      project_db      integration
          run_suite file-service         file_db         integration
          run_suite notification-service notification_db integration
