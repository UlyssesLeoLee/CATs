[package]
name = "cats-m1-s0-smoke"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "Apache-2.0"
authors = ["CATs Architecture Team"]
description = "M1-S0 smoke: validate actix-web 4 / tonic / yrs / sqlx compile on Rust 1.98.0 + PG 18.6 (per CATs_技术基线_v1.0 §2.3 OI-3)"

[lib]
path = "src/lib.rs"

[dependencies]
# Workspace shared deps (per Cargo.toml [workspace.dependencies])
actix-web.workspace = true
tokio.workspace = true
sqlx.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# Smoke-specific deps (versions per CATs_Rust技术选型书 v1.0 §4-§11 ADR 决策)
tonic = "0.12"
yrs = "0.18"
