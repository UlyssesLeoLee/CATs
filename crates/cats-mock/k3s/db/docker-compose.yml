# =====================================================================
# CATs MVP 数据层 — DB 本地验证 docker-compose
# owner: mvp-data worker (per 9/19 JST task)
# 不开 K8s manifests (worker#5 范围)
# =====================================================================
# 用法:
#   docker compose -f crates/cats-mock/k3s/db/docker-compose.yml up -d
#   ./crates/cats-mock/scripts/migrate_all.sh
#   docker compose -f crates/cats-mock/k3s/db/docker-compose.yml down -v
# =====================================================================
# 镜像版本锁死:
#   PostgreSQL 18.6 + pgvector 0.8.6 (per CATs_技术基线_v1.0 §1)
# 暴露端口: 5432 (避免与 K3s 端 30432 冲突, 本地 bind host port)

version: "3.9"

services:
  pg18:
    image: pgvector/pgvector:pg18
    container_name: cats-mvp-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_only_local
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # pgvector:pg18 要求挂 /var/lib/postgresql (父目录), 让 entrypoint 自己建 $PG_MAJOR 子目录
      - cats-mvp-pgdata:/var/lib/postgresql
      - ./conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cats-mvp-pgdata:
    name: cats-mvp-pgdata
