# =====================================================================
# PostgreSQL 18.6 + pgvector 0.8.6 本地验证配置
# =====================================================================
# 跟 K3s 阶段二生产配置 (CNPG Cluster spec) 隔离 — 这是 dev/CI 专用的
# 单机配置, 跑 SQL DDL + EXPLAIN 验证够用
# 引用: CATs_技术基线_v1.0 §1 (PG 18.6 锁定)

# 监听端口
port = 5432
listen_addresses = '*'
max_connections = 100

# 内存
shared_buffers = 256MB
work_mem = 4MB

# WAL / 复制 (本地验证关逻辑复制即可, 无物理流复制)
wal_level = logical
fsync = on
synchronous_commit = on

# pg_stat_statements (per v2.0 §5.2 慢查询监控)
shared_preload_libraries = 'pg_stat_statements'

# 日志 (CI 收集 EXPLAIN 时长, 简要格式)
logging_collector = on
log_min_duration_statement = 0
log_line_prefix = '%t [%p]: db=%d,user=%u,app=%a '
