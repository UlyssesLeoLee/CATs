[package]
name         = "translation-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description = "CATs 翻译核心 (gRPC server + TM/术语/QA/AI 网关接线, per 微服务架构 §4.1 + proto cats.v1.TranslationCoreService)"
readme      = "README.md"
publish     = false

[lints]
workspace = true

[dependencies]
# workspace 共享依赖
cats-common.workspace = true
tokio.workspace       = true
anyhow.workspace      = true
thiserror.workspace   = true
tracing.workspace     = true
tracing-subscriber.workspace = true
serde.workspace       = true
serde_json.workspace  = true
sqlx.workspace        = true
async-trait.workspace = true
# gRPC + Proto (per translation_core.proto)
cats-proto.workspace = true
tonic.workspace       = true
prost.workspace       = true
# pgvector 余弦相似度查询
pgvector = { version = "0.4", features = ["sqlx"] }
# 业务
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
dotenvy    = "0.15"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
serde_json = "1"
cats-mock = { workspace = true }