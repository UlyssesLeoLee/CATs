[package]
name         = "translation-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description = "CATs 翻译核心编排服务（per 微服务架构书 §4.1）"
readme      = "README.md"
publish     = false

[lints]
workspace = true

[dependencies]
# workspace 共享依赖
cats-common.workspace = true
tokio.workspace       = true
actix-web.workspace   = true
anyhow.workspace      = true
thiserror.workspace   = true
tracing.workspace     = true
serde.workspace       = true
serde_json.workspace  = true
sqlx.workspace        = true
# 跨服务 gRPC 契约（per translation_core.proto）
cats-proto.workspace = true
tonic.workspace       = true
# 这两个是接线时暴露出来的缺失依赖: ai_gateway.rs 用了 `async_trait::async_trait`、
# service.rs/db.rs 用了 `uuid`。在此之前这三个文件从来没进过编译,
# 所以没人发现 Cargo.toml 里少了它们。
async-trait.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
cats-mock = { workspace = true }
