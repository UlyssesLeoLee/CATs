[package]
name         = "cats-bff"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description = "CATs BFF 聚合服务（per 微服务架构书 §4.1）"
readme      = "README.md"
publish     = false

[lints]
workspace = true

[dependencies]
# workspace 共享依赖
cats-common.workspace = true
cats-rbac = { workspace = true }
tokio.workspace       = true
actix-web.workspace   = true
anyhow.workspace      = true
thiserror.workspace   = true
tracing.workspace     = true
serde.workspace       = true
serde_json.workspace  = true
reqwest.workspace     = true
chrono.workspace      = true
# JWT 签名验证 (per ULYS-149 审核: 之前只解 payload 不验签, 可伪造任意声明)
# 与 auth-service 用同一个 crate + 同一份 JWT_SECRET (HS256, per 技术选型书 §9 ADR-R-09)
jsonwebtoken          = "9"
# BFF 聚合层不直连 PG（透传到下游 service）
#
# 2026-10-05 接线 grpc_clients.rs（调 translation-core gRPC）时补上。
# 两者 workspace 里都已有：tonic 0.13 被 translation-core / worker-service 用着，
# cats-proto 是本仓 crate。加进来不改版本。
cats-proto.workspace = true
tonic.workspace      = true

[dev-dependencies]
cats-mock = { workspace = true }
