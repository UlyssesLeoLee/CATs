[package]
name         = "cats-rbac"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description = "CATs RBAC 中间件 (T-03 权限矩阵 v1.0 代码层落地, per 启动会决议 8 + 权限矩阵 commit 03dbede)"
readme      = "README.md"
publish     = false

[lints]
workspace = true

[dependencies]
# workspace 共享包元信息 (per Cargo.toml [workspace.dependencies])
cats-common.workspace    = true
tokio.workspace          = true
anyhow.workspace         = true
thiserror.workspace      = true
serde.workspace          = true
serde_json.workspace     = true
tracing.workspace        = true
tracing-subscriber.workspace = true
async-trait.workspace    = true
# service_helpers.rs 的依赖：它做 HttpRequest 层的 RBAC 取值，
# 并用 uuid 解析主体 id
actix-web.workspace      = true
uuid = { version = "1", features = ["v4", "serde"] }
