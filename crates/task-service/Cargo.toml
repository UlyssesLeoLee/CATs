[package]
name         = "task-service"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description = "CATs 翻译任务编排服务 (per 微服务架构设计书 §4.1 MVP 8 核心服务)"
readme      = "README.md"
publish     = false

[lints]
workspace = true

[dependencies]
# workspace 公共依赖
cats-common.workspace = true
tokio.workspace       = true
actix-web.workspace   = true
anyhow.workspace      = true
thiserror.workspace   = true
tracing.workspace     = true
tracing-subscriber.workspace = true
serde.workspace       = true
serde_json.workspace  = true
sqlx.workspace        = true
# gRPC 契约 (per common.proto)
cats-proto.workspace  = true
tonic.workspace       = true
# 业务
cats-rbac = { path = "../cats-rbac" }
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
dotenvy    = "0.15"
async-trait.workspace = true

[dev-dependencies]
actix-rt = "2"
actix-web = { workspace = true, features = ["macros"] }
serde_json = "1"
cats-mock = { workspace = true }