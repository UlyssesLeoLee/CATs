[package]
name         = "audit-service"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description = "CATs 审计服务（per 微服务架构书 §4.1）"
readme      = "README.md"
publish     = false

[lints]
workspace = true

[dependencies]
# workspace 共享依赖
cats-common.workspace = true
tokio.workspace       = true
actix-web.workspace   = true
anyhow.workspace      = true
thiserror.workspace   = true
tracing.workspace     = true
serde.workspace       = true
serde_json.workspace  = true
sqlx.workspace        = true
# 真实 Kafka consumer (ULYS-153 切片 C-2) — 通过 REST proxy HTTP 拉取
reqwest.workspace     = true
# consumer 自包含 schema (重复定义 KafkaAuditEvent, 不依赖孤儿 models.rs)
chrono     = { workspace = true }
uuid       = { version = "1", features = ["v4", "serde"] }
# 暂未挂接 gRPC 契约（M1 阶段按需引入）

[dev-dependencies]
cats-mock = { workspace = true }
