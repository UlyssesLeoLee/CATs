# CATs M0 共享 cargo 配置
# 引用: doc/02-基础设计/技术选型/CATs_Rust技术选型书_v1.0.md §3.2/§3.3

# --- 构建配置 ---
[build]
# Windows MSVC 与 Linux GNU 链接器差异巨大；这里不强制指定，让 rust-toolchain.toml + 目标平台自动选择
# 仅对所有 target 启用增量编译
incremental = true

# --- 目标目录 ---
# monorepo 共享 target/，减少重复编译
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[target.x86_64-unknown-linux-gnu]
# per ULYS-113 CI 审计: 直接把 linker 设为 rust-lld 会脱离 cc 驱动, 找不到系统库
# (-lgcc_s / -lc 等), 在 GitHub 托管 runner 上必挂。改走 cc + -fuse-ld=lld,
# 由 cc 提供标准库搜索路径, lld 只替换底层链接器 (per 技术选型书 §3.2/§3.3 原意)。
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
# 不加 -fuse-ld=lld override (per 实测更正, 见下)。
#
# 原以为 CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER 环境变量 (ci-rust-build.yaml
# 里指定 aarch64-linux-gnu-gcc) 会让本文件的设置完全不生效, 所以曾在这里也加过
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]——这个假设是错的: 环境变量只覆盖
# `linker` 这一项, 本 target 段的 `rustflags` 仍然会被拼进最终的链接命令。结果是
# aarch64-linux-gnu-gcc 被传了 -fuse-ld=lld, 但交叉编译环境里没有为 aarch64 配置
# 好对应的 lld 后端, collect2 报 "cannot find 'ld'", 交叉编译 job 直接挂掉
# (实测确认, per ULYS-113 CI 审计后续)。
#
# 设计文档 (CATs_Rust技术选型书_v1.0.md §3.2/§3.3) 的链接器优化示例本来就只写了
# x86_64-unknown-linux-gnu 一个 target, 这里不是文档原意覆盖的范围。交叉编译 job
# 完全靠上面那个环境变量 + apt 装的 gcc-aarch64-linux-gnu 工具链跑, 不需要也不该
# 加这个 override。

# --- 文档注释警告 ---
[doc]
# 公共 API 文档缺失时视为错误（CI clippy 进一步 -D warnings）
# 这里只做基础提示，CI 层做严格
warnings = true

# --- 注册表（per Rust 选型书 §3.7：默认 crates.io，CI 可走内部 mirror） ---
