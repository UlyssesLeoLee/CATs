# cargo-deny 配置（CI 引用 ci-rust-deny.yaml）
# 引用: doc/02-基础设计/技术选型/CATs_Rust技术选型书_v1.0.md §3.6（安全审计）
# 注意: M0 阶段仅运行 `licenses` 子命令（无需网络），其他子命令在 CI runner 上跑

[graph]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
allow = []
# 已知占位：M0 不强制白名单

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
version = 2
# 阈值 0.5：低于此置信度的 license 会被拒；纯 MIT/Apache-2.0 始终为 1.0
confidence-threshold = 0.5
# 关键技巧：cargo-deny 0.20.x 要求每个 SPDX 表达式单独列入 allow 列表；
# 多授权表达式（"MIT OR Apache-2.0"）必须原样列入（不要拆开为单个）。
allow = [
    # === 单一许可 ===
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "WTFPL",
    "BSL-1.0",
    "0BSD",
    "NCSA",
    "OpenSSL",
    "Zlib-acknowledgement",
    "Unicode-3.0-Disclaimer",
    # === 双许可表达式（Rust 生态标准）===
    "MIT OR Apache-2.0",
    "Apache-2.0 OR MIT",
    "MIT OR Apache-2.0 OR BSD-1-Clause",
    "MIT OR Apache-2.0 OR Zlib",
    "Apache-2.0 OR BSL-1.0",
    "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT",
    "0BSD OR Apache-2.0 OR MIT",
    "0BSD OR MIT OR Apache-2.0",
    "BSD-2-Clause OR Apache-2.0 OR MIT",
    "BSD-3-Clause OR MIT OR Apache-2.0",
    "MPL-2.0 OR Apache-2.0",
    "Unlicense OR MIT",
    "OpenSSL OR Apache-2.0",
    # === 含 AND 表达式（如 unicode 联合许可能） ===
    "(MIT OR Apache-2.0) AND Unicode-DFS-2016",
    "(Apache-2.0 OR MIT) AND Unicode-3.0",
    "Unicode-3.0 OR (ICU OR MIT)",
    "GPL-2.0 WITH Classpath-exception-2.0",
]
# CATs 项目许可证: Apache-2.0
# 多数 Rust 生态 crate 是 dual-licensed (MIT OR Apache-2.0)
# 已知 OSS 友好：Mozilla MPL-2.0、Unicode、Zlib、BSL、OpenSSL、CC0、Unlicense、WTFPL、ICU
# 注：FSFUL/FSFULLR/blessing/curl/libpng 等少数非标准许可暂不允许（出现时再加）
