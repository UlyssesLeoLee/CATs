apiVersion: v1
kind: Namespace
metadata:
  name: cats-data
  labels:
    name: cats-data
    app.kubernetes.io/part-of: cats-platform
    app.kubernetes.io/component: data-infrastructure
---
# CATs Kafka StatefulSet (K3s 阶段二 部署)
# 引用: doc/05-其他/管理/CATs_M1-Sprint1_SRE平台独立估算_v1.0.md (commit be712dc) §4 阶段二
# 引用: doc/02-基础设计/架构设计/CATs_微服务架构设计书_v1.0.md (commit 2910f3d) §14 阶段一/二 + §15 Kafka 部署
# 引用: doc/02-基础设计/架构设计/CATs_画图_v1.0.md (commit 0b9cec6) §3 部署架构
# 引用: doc/03-详细设计/接口设计/CATs_接口设计书_v2.0.md (commit 1f3c94d) §5 Kafka Topics + §6 端到端
# 引用: doc/05-其他/可观测性/CATs_告警规则_v1.0.md (commit 1d8926d) §4 实施
# 关联 commit baseline: 启动会决议 6 + 10 (commit 1b27b2b) + SRE 估算 v1.0 (be712dc) + 决议 6 9/11 实质落地
# 9/27 截止: T-07 Kafka 物理发布 (K3s 阶段二)
# 代签 per 守门 #14 v3: SRE 平台 Lead = Ulysses (Mavis 代签 per DEC-008) 5 域 Lead 槽位互不兼任 per 8/21
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cats-kafka
  namespace: cats-data
  labels:
    app: cats-kafka
    app.kubernetes.io/name: cats-kafka
    app.kubernetes.io/part-of: cats-platform
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/version: "3.7.0"
spec:
  serviceName: cats-kafka
  replicas: 3
  selector:
    matchLabels:
      app: cats-kafka
  template:
    metadata:
      labels:
        app: cats-kafka
        app.kubernetes.io/name: cats-kafka
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - cats-kafka
              topologyKey: kubernetes.io/hostname
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka-internal
              containerPort: 9092
            - name: kafka-controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['statefulset.kubernetes.io/pod-name']
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://cats-kafka-$(POD_NAME).cats-kafka.cats-data.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:SASL_PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@cats-kafka-0.cats-kafka.cats-data.svc.cluster.local:9093,2@cats-kafka-1.cats-kafka.cats-data.svc.cluster.local:9093,3@cats-kafka-2.cats-kafka.cats-data.svc.cluster.local:9093"
            - name: KAFKA_PROCESSES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['statefulset.kubernetes.io/pod-name']
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
              value: "300000"
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: "SCRAM-SHA-512"
            - name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL
              value: "SCRAM-SHA-512"
            - name: KAFKA_OPTS
              value: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_jaas.conf"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['statefulset.kubernetes.io/pod-name']
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /etc/kafka/secrets/kafka_jaas.conf ]; then
                echo "kafka_jaas.conf not found at /etc/kafka/secrets/"
                exit 1
              fi
              exec /etc/kafka/docker/run
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: secrets
              mountPath: /etc/kafka/secrets
              readOnly: true
            - name: config
              mountPath: /etc/kafka/config
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secretKeyRef:
                  name: cats-kafka-jaas
                  key: kafka_jaas.conf
        - name: config
          configMap:
            name: cats-kafka-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: cats-kafka
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cats-kafka
  namespace: cats-data
  labels:
    app: cats-kafka
spec:
  clusterIP: None
  selector:
    app: cats-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka-internal
    - name: kafka-controller
      port: 9093
      targetPort: kafka-controller
---
apiVersion: v1
kind: Service
metadata:
  name: cats-kafka-headless
  namespace: cats-data
  labels:
    app: cats-kafka
spec:
  clusterIP: None
  selector:
    app: cats-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka-internal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cats-kafka-config
  namespace: cats-data
  labels:
    app: cats-kafka
data:
  server.properties: |
    # Apache Kafka 3.7.0 KRaft mode (K3s 阶段二)
    # 引用: 微服务架构设计书 v1.0 §15 Kafka 部署 (commit 2910f3d) + SRE 估算 v1.0 §4 阶段二 (commit be712dc)
    process.roles=broker,controller
    node.id=${KAFKA_NODE_ID}
    controller.quorum.voters=${KAFKA_CONTROLLER_QUORUM_VOTERS}
    listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://cats-kafka-${POD_NAME}.cats-kafka.cats-data.svc.cluster.local:9092
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=PLAINTEXT
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:SASL_PLAINTEXT
    sasl.enabled.mechanisms=SCRAM-SHA-512
    sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    default.replication.factor=3
    min.insync.replicas=2
    num.partitions=6
    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
    auto.create.topics.enable=false
    compression.type=producer
