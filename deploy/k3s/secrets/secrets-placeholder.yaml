# cats-mvp secrets 占位
# 真实 secret 内容通过 sealed-secrets 或 external-secrets 注入, 这里只是占位
# per 接口设计 v1.5 §1.2: 服务间 mTLS + DB 凭据
---
apiVersion: v1
kind: Secret
metadata:
  name: cats-db-credentials
  namespace: cats-core
  annotations:
    sealed-secrets.cats.io/managed-by: Mavis
    sealed-secrets.cats.io/placeholder: "TBD-by-sealed-secrets-or-external-secrets"
type: Opaque
stringData:
  auth-db-url: "postgres://svc_auth:PLACEHOLDER@cats-postgres.cats-data.svc.cluster.local:5432/auth_db"
  user-db-url: "postgres://svc_user:PLACEHOLDER@cats-postgres.cats-data.svc.cluster.local:5432/user_db"
  project-db-url: "postgres://svc_project:PLACEHOLDER@cats-postgres.cats-data.svc.cluster.local:5432/project_db"
  task-db-url: "postgres://svc_task:PLACEHOLDER@cats-postgres.cats-data.svc.cluster.local:5432/task_db"
  task-db-readonly-url: "postgres://svc_report_ro:PLACEHOLDER@cats-postgres.cats-data.svc.cluster.local:5432/task_db"
  file-db-url: "postgres://svc_file:PLACEHOLDER@cats-postgres.cats-data.svc.cluster.local:5432/file_db"
  notification-db-url: "postgres://svc_notify:PLACEHOLDER@cats-postgres.cats-data.svc.cluster.local:5432/notification_db"
  report-db-url: "postgres://svc_report:PLACEHOLDER@cats-postgres.cats-data.svc.cluster.local:5432/report_db"
  audit-db-url: "postgres://svc_audit:PLACEHOLDER@cats-postgres.cats-data.svc.cluster.local:5432/audit_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: cats-jwt-secret
  namespace: cats-core
  annotations:
    sealed-secrets.cats.io/placeholder: "TBD-by-sealed-secrets"
type: Opaque
stringData:
  secret: "PLACEHOLDER-rotate-every-90-days-per-ADR-008"
---
apiVersion: v1
kind: Secret
metadata:
  name: cats-ai-keys
  namespace: cats-core
  annotations:
    sealed-secrets.cats.io/placeholder: "TBD-by-external-secrets"
type: Opaque
stringData:
  openai: "PLACEHOLDER-openai-key"
  anthropic: "PLACEHOLDER-anthropic-key"
  deepseek: "PLACEHOLDER-deepseek-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-credentials
  namespace: cats-data
  annotations:
    sealed-secrets.cats.io/placeholder: "TBD-by-sealed-secrets"
type: Opaque
stringData:
  sasl-username: "PLACEHOLDER"
  sasl-password: "PLACEHOLDER"