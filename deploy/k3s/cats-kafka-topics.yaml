apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: file.events
  namespace: cats-data
  labels:
    app: cats-file-service
    app.kubernetes.io/part-of: cats-platform
    app.kubernetes.io/component: kafka-topic
    strimzi.io/cluster: cats-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 604800000  # 7 天
    cleanup.policy: delete
    compression.type: producer
    min.insync.replicas: 2
  # 引用: 接口设计书 v2.0+2 §5 Kafka Topics (commit 1f3c94d)
  # 引用: 接口设计书 v2.0+2 §6 端到端示例 步骤 5-6 (file-service Outbox + Debezium CDC → file.events topic)
---
