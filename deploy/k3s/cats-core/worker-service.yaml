apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: cats-core
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: worker-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker-service }
    spec:
      serviceAccountName: worker-service
      containers:
        - name: worker-service
          image: cats/worker-service:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: cats-db-credentials, key: task-db-url } }
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: TRANSLATION_CORE_URL
              value: "http://translation-core.cats-core.svc.cluster.local:50051"
            - name: RUST_LOG
              value: "info"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:  { httpGet: { path: /healthz, port: 8080 } }
          readinessProbe: { httpGet: { path: /readyz, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: cats-core
spec:
  selector: { app.kubernetes.io/name: worker-service }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  type: ClusterIP