apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cats-core
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/version: 0.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/version: 0.1.0
    spec:
      serviceAccountName: auth-service
      containers:
        - name: auth-service
          image: cats/auth-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cats-db-credentials
                  key: auth-db-url
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cats-jwt-secret
                  key: secret
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: cats-core
spec:
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP