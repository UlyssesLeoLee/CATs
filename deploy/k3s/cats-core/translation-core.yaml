apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-core
  namespace: cats-core
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: translation-core }
  template:
    metadata:
      labels: { app.kubernetes.io/name: translation-core }
    spec:
      serviceAccountName: translation-core
      containers:
        - name: translation-core
          image: cats/translation-core:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: GRPC_BIND_ADDR
              value: "0.0.0.0:50051"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: cats-db-credentials, key: project-db-url } }
            - name: AI_GATEWAY_URL
              value: "http://cats-ai-gateway.cats-core.svc.cluster.local:8090"
            - name: RUST_LOG
              value: "info"
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:
            tcpSocket: { port: 50051 }
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket: { port: 50051 }
---
apiVersion: v1
kind: Service
metadata:
  name: translation-core
  namespace: cats-core
spec:
  selector: { app.kubernetes.io/name: translation-core }
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP