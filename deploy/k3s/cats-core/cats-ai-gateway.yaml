apiVersion: apps/v1
kind: Deployment
metadata:
  name: cats-ai-gateway
  namespace: cats-core
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: cats-ai-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cats-ai-gateway }
    spec:
      serviceAccountName: cats-ai-gateway
      containers:
        - name: cats-ai-gateway
          image: cats/cats-ai-gateway:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
              name: http
            - containerPort: 50061
              name: grpc
          env:
            - name: REST_BIND_ADDR
              value: "0.0.0.0:8090"
            - name: GRPC_BIND_ADDR
              value: "0.0.0.0:50061"
            - name: COMPLIANCE_MODE
              value: "Cloud"
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: cats-ai-keys, key: openai } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: cats-ai-keys, key: anthropic } }
            - name: DEEPSEEK_API_KEY
              valueFrom: { secretKeyRef: { name: cats-ai-keys, key: deepseek } }
            - name: RUST_LOG
              value: "info"
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:  { httpGet: { path: /healthz, port: 8090 } }
          readinessProbe: { httpGet: { path: /readyz, port: 8090 } }
---
apiVersion: v1
kind: Service
metadata:
  name: cats-ai-gateway
  namespace: cats-core
spec:
  selector: { app.kubernetes.io/name: cats-ai-gateway }
  ports:
    - name: http
      port: 8090
      targetPort: 8090
    - name: grpc
      port: 50061
      targetPort: 50061
  type: ClusterIP