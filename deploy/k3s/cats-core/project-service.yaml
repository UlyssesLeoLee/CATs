apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: cats-core
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: project-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: project-service }
    spec:
      serviceAccountName: project-service
      containers:
        - name: project-service
          image: cats/project-service:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: cats-db-credentials, key: project-db-url } }
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: "info"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:  { httpGet: { path: /healthz, port: 8080 } }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: cats-core
spec:
  selector: { app.kubernetes.io/name: project-service }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  type: ClusterIP