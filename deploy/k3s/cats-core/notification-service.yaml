apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cats-core
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notification-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notification-service }
    spec:
      serviceAccountName: notification-service
      containers:
        - name: notification-service
          image: cats/notification-service:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: cats-db-credentials, key: notification-db-url } }
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: KAFKA_NOTIFICATIONS_TOPIC
              value: "cats.notifications.v1"
            - name: KAFKA_BROKER
              value: "cats-kafka.cats-data.svc.cluster.local:9092"
            - name: RUST_LOG
              value: "info"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:  { httpGet: { path: /healthz, port: 8080 } }
          # 2026-10-07：原本指向 /healthz，而 /healthz 恒返 200 且不查任何依赖
          # —— 数据库挂了 Pod 照样 Ready，流量继续被派发进来，每个请求都 500。
          # /readyz 会真探一次 DB，不可用时返回 503。
          readinessProbe: { httpGet: { path: /readyz, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cats-core
spec:
  selector: { app.kubernetes.io/name: notification-service }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  type: ClusterIP