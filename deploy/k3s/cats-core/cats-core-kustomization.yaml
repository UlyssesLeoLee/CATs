apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cats-core: 9 MVP 服务 + translation-core + cats-ai-gateway
# per 微服务架构 v1.0 §4.1 (MVP 商业版就绪)

namespace: cats-core

resources:
  - auth-service.yaml
  - user-service.yaml
  - project-service.yaml
  - task-service.yaml
  - file-service.yaml
  - notification-service.yaml
  - report-service.yaml
  - audit-service.yaml
  - worker-service.yaml
  - translation-core.yaml
  - cats-ai-gateway.yaml

# 通用 labels
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: cats
      app.kubernetes.io/component: backend
      app.kubernetes.io/managed-by: mvp-final-sre