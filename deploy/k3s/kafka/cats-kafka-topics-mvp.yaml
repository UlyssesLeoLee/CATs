  namespace: cats-data
  labels:
    app: cats-audit-service
    app.kubernetes.io/part-of: cats-platform
    app.kubernetes.io/component: kafka-topic
    strimzi.io/cluster: cats-kafka-mvp
    event-type: cats.audit
spec:
  partitions: 6
  replicas: 1
  config:
    retention.ms: 2592000000  # 30 天 (合规要求, per 错误码表 §5.2 audit 30d)
    cleanup.policy: delete
    compression.type: producer
    min.insync.replicas: 1
  # 引用: 接口设计书 §5 + 错误码表 §5.2 cats.audit.v1 → audit.events
  # 引用: 安全要件定义书 §6 audit 30 天保留 (合规)
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: cats.notifications.v1
  namespace: cats-data
  labels:
    app: cats-notification-service
    app.kubernetes.io/part-of: cats-platform
    app.kubernetes.io/component: kafka-topic
    strimzi.io/cluster: cats-kafka-mvp
    event-type: cats.notifications
spec:
  partitions: 6
  replicas: 1
  config:
    retention.ms: 604800000  # 7 天
    cleanup.policy: delete
    compression.type: producer
    min.insync.replicas: 1
  # 引用: 接口设计书 §5 notification.events + 错误码表 §5.2 notification 7d
---
# kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cats-data
resources:
  - cats-kafka-mvp.yaml
  - cats-kafka-topics-mvp.yaml
