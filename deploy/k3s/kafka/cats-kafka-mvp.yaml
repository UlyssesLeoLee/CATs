# CATs Kafka MVP 单节点 KRaft 部署 (M1-Sprint 1 MVP SRE 落地)
# 引用: doc/02-基础设计/架构设计/CATs_微服务架构设计书_v1.0.md (commit 2910f3d) §15 Kafka 部署
# 引用: doc/05-其他/管理/CATs_M1-Sprint1_SRE平台独立估算_v1.0.md (commit be712dc) §4 K3s 阶段二
# 引用: deploy/kafka-physical-publish-design.md (commit 8b11117) §1 Kafka 集群架构
# 引用: doc/03-详细设计/接口设计/CATs_接口设计书_v2.0.md (commit 1f3c94d) §5 Kafka Topics 10 个
# 引用: doc/05-其他/管理/CATs_错误码表_v1.0.1.md (commit a4d8b86) §5.2 Kafka topic 映射
#
# MVP 简化 (per 任务边界): 单 broker KRaft 模式, 不需要 SASL, PLAINTEXT 内部 listener
# Sprint 2 切换到 3 broker + SASL/SCRAM-SHA-512 (per deploy/k3s/cats-kafka-statefulset.yaml 8b11117 commit)
#
# topic auto-create 关 (per deploy/kafka-physical-publish-design.md §1.3 已知缺口)
# 10 KafkaTopic CRD 复用 cats-kafka-topics.yaml (commit 8b11117, Strimzi CRD)
#
# 部署前置:
#   1. helm repo add strimzi https://strimzi.io/charts/
#   2. helm install strimzi strimzi/strimzi-kafka-operator --namespace cats-data
#   3. kubectl apply -f deploy/k3s/namespaces.yaml
#   4. kubectl apply -f deploy/k3s/secrets/kafka-credentials.yaml
#   5. kubectl apply -f deploy/k3s/kafka/cats-kafka-mvp.yaml
#   6. kubectl apply -f deploy/k3s/kafka/cats-kafka-topics-mvp.yaml
#
# 守门合规: 0 env 打印 + 0 写真实凭据 + #14 v3 代签
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cats-kafka-mvp-config
  namespace: cats-data
  labels:
    app: cats-kafka
    app.kubernetes.io/name: cats-kafka
    app.kubernetes.io/part-of: cats-platform
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/version: "3.7.0"
    mode: mvp-single-broker
data:
  server.properties: |
    # Apache Kafka 3.7.0 KRaft mode - MVP 单 broker (M1-Sprint 1 落地)
    # 引用: deploy/kafka-physical-publish-design.md (8b11117) §1 + §5 + 微服务架构 v1.0 (2910f3d) §15
    #
    # KRaft mode (无 ZK)
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@cats-kafka-mvp-0.cats-kafka-mvp.cats-data.svc.cluster.local:9093
    listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://cats-kafka-mvp.cats-data.svc.cluster.local:9092
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=PLAINTEXT
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    # MVP 简化: 不启用 SASL (Sprint 2 启用 SCRAM-SHA-512, per 8b11117 §1.1)
    # sasl.enabled.mechanisms=SCRAM-SHA-512
    # sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
    # 副本因子 (MVP 单 broker = 1)
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    default.replication.factor=1
    min.insync.replicas=1
    num.partitions=1
    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
    # Topic auto-create 关 (per 8b11117 §1.3 已知缺口)
    auto.create.topics.enable=false
    compression.type=producer
    # MVP 阶段: 内存 / 磁盘
    log.flush.interval.messages=10000
    log.flush.interval.ms=1000
---
# 单 broker KRaft mode StatefulSet (MVP)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cats-kafka-mvp
  namespace: cats-data
  labels:
    app: cats-kafka-mvp
    app.kubernetes.io/name: cats-kafka-mvp
    app.kubernetes.io/part-of: cats-platform
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/version: "3.7.0"
    mode: mvp-single-broker
spec:
  serviceName: cats-kafka-mvp
  replicas: 1  # MVP 单 broker (per 任务边界 "1 节点 KRaft 模式")
  selector:
    matchLabels:
      app: cats-kafka-mvp
  template:
    metadata:
      labels:
        app: cats-kafka-mvp
        app.kubernetes.io/name: cats-kafka-mvp
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka-internal
              containerPort: 9092
            - name: kafka-controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://cats-kafka-mvp.cats-data.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@cats-kafka-mvp-0.cats-kafka-mvp.cats-data.svc.cluster.local:9093"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: config
              mountPath: /etc/kafka/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cats-kafka-mvp-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: cats-kafka-mvp
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi  # MVP 单 broker 50Gi (Sprint 2 切 3 broker 时扩到 100Gi)
---
apiVersion: v1
kind: Service
metadata:
  name: cats-kafka-mvp
  namespace: cats-data
  labels:
    app: cats-kafka-mvp
spec:
  clusterIP: None  # Headless service, StatefulSet pod DNS
  selector:
    app: cats-kafka-mvp
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka-internal
    - name: kafka-controller
      port: 9093
      targetPort: kafka-controller
---
# ClusterIP service 暴露内部访问
apiVersion: v1
kind: Service
metadata:
  name: cats-kafka-mvp-bootstrap
  namespace: cats-data
  labels:
    app: cats-kafka-mvp
spec:
  selector:
    app: cats-kafka-mvp
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka-internal
