# envoy-mvp.yaml - CATs MVP 边缘代理 (per 9/1 用户偏好 envoy 独立 deployment)
static_resources:
  listeners:
    - name: ingress_http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: cats_edge
                route_config:
                  virtual_hosts:
                    - name: cats_api
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/v1/auth/" }
                          route: { cluster: auth_service }
                        - match: { prefix: "/v1/users" }
                          route: { cluster: auth_service }
                        - match: { prefix: "/v1/projects" }
                          route: { cluster: project_service }
                        - match: { prefix: "/v1/tasks" }
                          route: { cluster: task_service }
                        - match: { prefix: "/v1/files" }
                          route: { cluster: file_service }
                        - match: { prefix: "/v1/notifications" }
                          route: { cluster: notification_service }
                        - match: { prefix: "/v1/reports" }
                          route: { cluster: report_service }
                        - match: { prefix: "/v1/audit-logs" }
                          route: { cluster: audit_service }
                        - match: { prefix: "/healthz" }
                          direct_response: { status: 200, body: { inline_string: "ok" } }
                http_filters:
                  - name: envoy.filters.http.router

  clusters:
    - name: auth_service
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: auth_service
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: auth-service, port_value: 8080 } } }
    - name: project_service
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: project_service
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: project-service, port_value: 8080 } } }
    - name: task_service
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: task_service
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: task-service, port_value: 8080 } } }
    - name: file_service
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: file_service
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: file-service, port_value: 8080 } } }
    - name: notification_service
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: notification_service
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: notification-service, port_value: 8080 } } }
    - name: report_service
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: report_service
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: report-service, port_value: 8080 } } }
    - name: audit_service
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: audit_service
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: audit-service, port_value: 8080 } } }