# cargo-deny 配置（M0 阶段）
# 引用: doc/02-基础设计/技术选型/CATs_Rust技术选型书_v1.0.md §3.6（安全审计）
# 引用: https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
#
# cargo-deny 0.20.x 行为：
# - allow 列表只接受已知 SPDX identifier
# - 多授权表达式（"MIT OR Apache-2.0"）由 SPDX 解析器自动求值：
#   只要表达式中所有 leaf identifier 都在 allow 列表中，crate 即被允许
# - 未知 identifier（如 libpng / Zlib-acknowledgement）会被 cargo-deny 拒绝

[graph]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
allow = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
version = 2
confidence-threshold = 0.5
# 主流许可：Rust 生态 90% 在此覆盖
# 仅列已知 SPDX identifier（cargo-deny 内置数据库）
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "WTFPL",
    "BSL-1.0",
    "0BSD",
    "NCSA",
    "OpenSSL",
    "GPL-2.0 WITH Classpath-exception-2.0",
    "CDLA-Permissive-2.0",  # Community Data License (per rustsec/rustsec admin 数据)
]
