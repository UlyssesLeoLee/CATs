name: Deploy vercelserver to Vercel

# 触发: vercelserver/** push, 或 workflow_dispatch 手动触发.
# 设计原则: vercelserver/ 是独立可复用部署套件, CI 也只动这个目录.
#   1. checkout 完整仓 (因为 build.sh 要从 SOURCE_ROOT=.. 拉 cats-client + deploy/)
#   2. 跑 vercelserver/scripts/build.sh
#   3. cd vercelserver/ && vercel deploy --prod
#
# 依赖 GitHub secret:
#   VERCEL_TOKEN       — Personal Token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — vercel teams ls 或 Vercel Settings → General
#   VERCEL_PROJECT_ID  — 创建项目后从 .vercel/project.json 读

on:
  push:
    branches: [main, dev]
    paths:
      - 'vercelserver/**'
  workflow_dispatch:

concurrency:
  group: deploy-vercelserver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vercelserver
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run build.sh
        run: bash scripts/build.sh

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project info
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        continue-on-error: true

      - name: Deploy (preview)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: vercel deploy --yes --token=$VERCEL_TOKEN

      - name: Deploy (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel deploy --yes --prod --token=$VERCEL_TOKEN
